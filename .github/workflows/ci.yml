name: Continuous Integration
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Release metadata and documentation audit
        run: python scripts/release_audit.py
      - name: Run tests
        working-directory: backend
        run: python -m pytest -q
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install packages
        working-directory: frontend
        run: npm install
      - name: Compile production bundle
        working-directory: frontend
        run: npm run build
  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Browser smoke tests
        working-directory: frontend
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
  container-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build and start local containers
        run: docker compose up --build -d --wait --wait-timeout 300
      - name: Verify same-origin frontend and API
        run: |
          curl --fail --show-error --silent http://127.0.0.1:5173/ | grep -q '<html'
          python - <<'PYCODE'
          import json
          from pathlib import Path
          from urllib.request import urlopen
          expected = json.loads(Path('frontend/package.json').read_text())['version']
          with urlopen('http://127.0.0.1:5173/api/health', timeout=15) as response:
              actual = json.load(response)
          if actual.get('status') != 'ok' or actual.get('version') != expected:
              raise SystemExit(f'Health/version mismatch: {actual}, expected {expected}')
          print(f'API version verified: {expected}')
          PYCODE
          curl --fail --show-error --silent http://127.0.0.1:5173/api/catalog > /dev/null
      - name: Container logs when failing
        if: failure()
        run: docker compose logs --no-color
      - name: Stop containers without deleting archives
        if: always()
        run: docker compose down
